name: Build Windows EXE

# Builds both ApexVault versions into standalone Windows .exe files.
# Runs automatically on every push to main, and can also be started manually
# from the "Actions" tab (Run workflow button).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # 1) ApexVault-Python  —  PyQt6 desktop version
  # ------------------------------------------------------------------
  build-python-version:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Rust toolchain (for the apex_crypto crypto core) ---
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # --- Python ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --- Build the Rust extension module (produces apex_crypto.dll) ---
      - name: Build apex_crypto (Rust)
        working-directory: ApexVault-Python/apex_crypto
        run: cargo build --release

      - name: Place compiled Rust module at project root
        shell: pwsh
        working-directory: ApexVault-Python
        run: |
          $dll = Get-ChildItem -Path apex_crypto\target\release -Filter "apex_crypto.dll" -Recurse | Select-Object -First 1
          if ($null -eq $dll) { throw "apex_crypto.dll not found after cargo build" }
          Copy-Item $dll.FullName -Destination "apex_crypto.pyd"
          Write-Host "Copied $($dll.FullName) -> apex_crypto.pyd"

      # --- Python dependencies (face recognition is included) ---
      - name: Install dependencies
        working-directory: ApexVault-Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install PyQt6 pywin32 opencv-python numpy
          pip install dlib face-recognition face-recognition-models

      # --- Build the .exe ---
      - name: Build executable
        working-directory: ApexVault-Python
        run: pyinstaller build.spec --noconfirm --clean

      # --- Quick sanity check: exe exists ---
      - name: Verify build output
        shell: pwsh
        working-directory: ApexVault-Python
        run: |
          if (!(Test-Path "dist/ApexVault-Python.exe")) { throw "Build failed: ApexVault-Python.exe missing" }
          Get-Item "dist/ApexVault-Python.exe" | Format-List Name, Length

      # --- Upload the .exe as a downloadable build artifact ---
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexVault-Python-exe
          path: ApexVault-Python/dist/ApexVault-Python.exe
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 2) ApexVault-Web  —  pywebview + HTML/CSS version
  # ------------------------------------------------------------------
  build-web-version:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build apex_crypto (Rust)
        working-directory: ApexVault-Web/apex_crypto
        run: cargo build --release

      - name: Place compiled Rust module at project root
        shell: pwsh
        working-directory: ApexVault-Web
        run: |
          $dll = Get-ChildItem -Path apex_crypto\target\release -Filter "apex_crypto.dll" -Recurse | Select-Object -First 1
          if ($null -eq $dll) { throw "apex_crypto.dll not found after cargo build" }
          Copy-Item $dll.FullName -Destination "apex_crypto.pyd"
          Write-Host "Copied $($dll.FullName) -> apex_crypto.pyd"

      - name: Install dependencies
        working-directory: ApexVault-Web
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install pywebview cryptography pywin32
          pip install opencv-python numpy
          pip install dlib face-recognition face-recognition-models

      - name: Build executable
        working-directory: ApexVault-Web
        run: pyinstaller build.spec --noconfirm --clean

      - name: Verify build output
        shell: pwsh
        working-directory: ApexVault-Web
        run: |
          if (!(Test-Path "dist/ApexVault-Web.exe")) { throw "Build failed: ApexVault-Web.exe missing" }
          Get-Item "dist/ApexVault-Web.exe" | Format-List Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexVault-Web-exe
          path: ApexVault-Web/dist/ApexVault-Web.exe
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 3) Publish both .exe files to a GitHub Release
  # ------------------------------------------------------------------
  release:
    needs: [ build-python-version, build-web-version ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Download both exe artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "ApexVault v1.0.0"
          body: |
            ## ApexVault — Windows builds

            Two standalone Windows executables (no Python install required):

            | File | Version |
            |------|---------|
            | `ApexVault-Python.exe` | Desktop UI (PyQt6) |
            | `ApexVault-Web.exe`    | Web UI (HTML/CSS + pywebview) |

            Both include the Rust crypto core (`apex_crypto`) and Face ID support.
          files: |
            artifacts/ApexVault-Python-exe/ApexVault-Python.exe
            artifacts/ApexVault-Web-exe/ApexVault-Web.exe
          fail_on_unmatched_files: true